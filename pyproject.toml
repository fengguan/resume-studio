[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-studio"
version = "0.1.0"
description = "Local evidence-grounded resume tailoring with annotated Word review"
requires-python = ">=3.10"
dependencies = [
  "python-docx>=1.2,<2", "pydantic>=2.10,<3", "httpx>=0.27,<1",
  "streamlit>=1.42,<2", "python-dotenv>=1,<2", "pypdf>=5,<7",
  "filelock>=3.16,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11", "playwright>=1.50"]

[project.scripts]
resume-studio = "resume_studio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
resume_studio = ["review_component/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
